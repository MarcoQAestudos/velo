# Workflow de Integração Contínua focado exclusivamente
# na execução de testes unitários com Vitest.
# Estrutura preparada para futuras expansões.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN:  ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: marcoqaestudos-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto utilizando Yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # 1 - Realiza o checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # 2 - Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3 - Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4 - Instala as dependências do projeto utilizando Yarn
      - name: Install Dependencies
        run: yarn install
      
      # 5 - Build para o vercel
      - name: Build Vercel
        run: yarn vercel build --tokrn=$VERCEL_TOKEN

      # 6 - Deploy preview no vercel
      - name: Deploy preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      
      

      
    

